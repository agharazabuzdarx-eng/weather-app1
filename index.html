<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e3a8a">
    <meta property="og:title" content="Current Weather Check">
    <meta property="og:description" content="Check current weather information easily.">
    <meta property="og:image" content="https://agharazabuzdarx-eng.github.io/weather-app1/preview.jpg">
    <meta property="og:image:alt" content="Current weather dashboard preview">
    <meta property="og:url" content="https://agharazabuzdarx-eng.github.io/weather-app1/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://agharazabuzdarx-eng.github.io/weather-app1/preview.jpg">
    <title>Current weather check</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="app-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="app-icon-180.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.css">
</head>
<body>
    <div class="container">
        <h1>Current Weather</h1>
        <div class="search-bar">
            <input type="text" id="cityInput" placeholder="Search city name" aria-label="Search city name">
            <button id="searchBtn" type="button" aria-label="Search weather"><i class="fa-solid fa-magnifying-glass"></i></button>
            <div id="error" class="error-message"></div>
            <div id="weatherInfo" class="weatherInfo hidden">
                <h2 id="cityName">Lahore</h2>
                <div id="dateTime" class="date-time"></div>
                <div id="qamariDate" class="date-box"></div>
                <div id="hinduDate" class="date-box"></div>
                <div id="condition" class="condition"></div>
                <div class="details">
                    <div><i class="fa-solid fa-temperature-three-quarters"></i><span id="temperatur">°C</span></div>
                    <div><i class="fa-solid fa-wind"></i><span id="windSpeed"></span>km/h Wind</div>
                    <div><i class="fa-solid fa-droplet"></i><span id="humidity"></span>% Humidity</div>
                    <div><i class="fa-solid fa-sun"></i><span id="sunrise">Sunrise: --:--</span></div>
                    <div><i class="fa-solid fa-moon"></i><span id="sunset">Sunset: --:--</span></div>
                    <p>Made by Agha Raza Hussain Buzdar</p>
                </div>
                <section class="prayer-times" aria-labelledby="prayerTimesTitle">
                    <h3 id="prayerTimesTitle">Prayer Times</h3>
                    <p id="prayerTimesDate" class="prayer-times-date"></p>
                    <div class="prayer-times-grid">
                        <div><span>Fajr</span><strong id="fajrTime">--</strong></div>
                        <div><span>Dhuhr</span><strong id="dhuhrTime">--</strong></div>
                        <div><span>Asr</span><strong id="asrTime">--</strong></div>
                        <div><span>Maghrib</span><strong id="maghribTime">--</strong></div>
                        <div><span>Isha</span><strong id="ishaTime">--</strong></div>
                    </div>
                    <p id="prayerTimesStatus" class="prayer-times-status" role="status" aria-live="polite"></p>
                    <p class="prayer-times-method">Karachi calculation method · Hanafi Asr · Local city time</p>
                </section>
            </div>
        </div>
        <button id="installAppBtn" class="install-app-button" type="button">Download App</button>
        <p id="installMessage" class="install-message" role="status" aria-live="polite"></p>
    </div>     
    

    <script src="script.js"></script>
</body>
</html>
